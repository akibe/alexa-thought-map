<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thought Map</title><!-- STYLE --></head>
<body><main class="app" aria-label="Thought Map">
  <header><div class="wordmark"><span class="brand-mark" aria-hidden="true">✳</span> THOUGHT MAP</div><span id="provenance" class="provenance">MCP App</span><span id="count" class="count">0 thoughts</span></header>
  <section class="intro"><p id="eyebrow" class="eyebrow">A LITTLE ROOM TO THINK</p><h1 id="title">Let it all out.</h1><p id="subtitle">Your thoughts can stay unfinished here.</p></section>
  <div id="quiet" class="quiet"><div class="quiet-orbit" aria-hidden="true"><i></i><i></i><i></i></div><p id="quiet-text" role="status">Waiting for your map.</p></div>
  <section id="visual" class="visual" hidden aria-label="Map visualization"><div id="canvas" class="canvas"></div><p id="map-note" class="map-note"></p><aside id="insight" class="insight" aria-label="Map insights"></aside></section>
  <footer><nav id="stages" aria-label="Map stages"><button type="button" data-stage="0" aria-label="Stage 0: All thoughts">00<span>Thoughts</span></button><button type="button" data-stage="1" aria-label="Stage 1: Topic clusters">01<span>Gather</span></button><button type="button" data-stage="2" aria-label="Stage 2: Shared roots">02<span>Connect</span></button><button type="button" data-stage="3" aria-label="Stage 3: Focus">03<span>Begin</span></button></nav><button type="button" id="all-thoughts" class="text-button" disabled>Read thoughts</button><button type="button" id="replay" class="icon-button" aria-label="Replay stages" disabled>↺</button><button type="button" id="next" class="next" disabled>Next <span aria-hidden="true">→</span></button></footer>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main><dialog id="details" aria-labelledby="detail-title"><div class="dialog-header"><span class="eyebrow">A CLOSER LOOK</span><button type="button" id="close-details" class="icon-button" aria-label="Close details">×</button></div><h2 id="detail-title"></h2><p id="detail-reason"></p><p id="detail-action" class="detail-action"></p><ol id="detail-list"></ol></dialog><!-- SCRIPT --></body></html>
