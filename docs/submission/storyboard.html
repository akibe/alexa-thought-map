<h1>“I was not asking for an answer yet.”</h1>
<p>Concept screens for discussion · synthetic example · not application screenshots · each screen 768 × 480</p>
<main class="boards">
<figure><figcaption>01 · Let the thought finish / 0:20–1:00</figcaption>
<section class="screen listen" aria-label="Listening concept screen">
<div class="bar"><span class="brand">THOUGHT MAP</span><span><i class="signal"></i>Listening</span></div>
<h2 style="font-size:22px">Listening.</h2><p class="sub" style="font-size:16px">Say “show me” when you are ready.</p>
<p class="received">16 thoughts received</p>
<div class="proof">CONCEPT · Synthetic example · Intended Alexa+ interaction, not device footage</div>
</section></figure>
<figure><figcaption>02 · Familiar topics / 1:00–1:17</figcaption>
<section class="screen" aria-label="Thoughts grouped by topic concept screen">
<div class="bar"><span class="brand">THOUGHT MAP</span><span>1 / 3 · Topics</span></div>
<h2>A little less scattered.</h2><p class="sub">Six selected thoughts from the 16-item example.</p>
<div class="columns">
<div class="topic"><h3>Identity</h3><p class="thought">Too many job titles.</p></div>
<div class="topic"><h3>Work admin</h3><p class="thought">What should I charge?</p></div>
<div class="topic"><h3>Creativity</h3><p class="thought">More music work.</p><p class="thought b">I haven't been drawing.</p></div>
<div class="topic"><h3>People &amp; time</h3><p class="thought b">I can't say no.</p><p class="thought b">Next month is full.</p></div>
</div><div class="proof">CONCEPT · Simplified topic view for storyboard · Synthetic example</div>
</section></figure>
<figure><figcaption>03 · The reveal: one thought changes groups / 1:17–1:45</figcaption>
<section class="screen" aria-label="Hypothesized roots concept screen">
<div class="bar"><span class="brand">THOUGHT MAP</span><span>2 / 3 · Possible connections</span></div>
<h2>Different topics. A shared knot?</h2><p class="sub">What might need to change for these concerns to ease?</p>
<div class="roots">
<div class="root"><h3>I haven't decided how to describe what I offer.</h3><p>Too many job titles.</p><p>What should I charge?</p><p class="line"><span class="origin">FROM CREATIVITY</span>More music work.</p></div>
<div class="root other"><h3>I struggle to say no, leaving little room for myself.</h3><p>I can't say no.</p><p>Next month is full.</p><p class="line"><span class="origin">FROM CREATIVITY</span>I haven't been drawing.</p></div>
</div><div class="proof">CONCEPT · Fixed illustrative result · Possible connections, not proven causes</div>
</section></figure>
<figure><figcaption>04 · Leave with one small move / 1:45–2:00</figcaption>
<section class="screen" aria-label="One next action concept screen">
<div class="bar"><span class="brand">THOUGHT MAP</span><span>3 / 3 · One next step</span></div>
<div class="focus"><div class="eyebrow">A POSSIBLE STARTING POINT</div><h2>I haven't decided how to describe<br>what I offer.</h2><span class="small">Connected to 8 of 16 thoughts in this illustrative result</span></div>
<div class="action"><span class="small">TRY THIS</span><p>Write a one-sentence introduction<br>using one role.</p></div>
<p class="retained">Your other thoughts stay in the map.</p>
<div class="proof">CONCEPT · Fixed illustrative result · A suggestion to consider, not a diagnosis</div>
</section></figure>
